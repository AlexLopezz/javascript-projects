<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>

    <!-- Style & Fav icon -->
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="https://fav.farm/%F0%9F%94%89" />
</head>
<body>
    <div class="keys">
        <div data-key="65" class="key">
            <kbd>A</kbd>
            <span class="sound">clap</span>
        </div>
        <div data-key="83" class="key">
            <kbd>S</kbd>
            <span class="sound">hithat</span>
        </div>
        <div data-key="68" class="key">
            <kbd>D</kbd>
            <span class="sound">kick</span>
        </div>
        <div data-key="70" class="key">
            <kbd>F</kbd>
            <span class="sound">openhat</span>
        </div>
        <div data-key="71" class="key">
            <kbd>G</kbd>
            <span class="sound">boom</span>
        </div>
        <div data-key="72" class="key">
            <kbd>H</kbd>
            <span class="sound">ride</span>
        </div>
        <div data-key="74" class="key">
            <kbd>J</kbd>
            <span class="sound">snare</span>
        </div>
        <div data-key="75" class="key">
            <kbd>K</kbd>
            <span class="sound">tom</span>
        </div>
        <div data-key="76" class="key">
            <kbd>L</kbd>
            <span class="sound">tink</span>
        </div>
    </div>

    <audio data-key="65" src="/assets/sounds/clap.wav"></audio>
    <audio data-key="83" src="/assets/sounds/hihat.wav"></audio>
    <audio data-key="68" src="/assets/sounds/kick.wav"></audio>
    <audio data-key="70" src="/assets/sounds/openhat.wav"></audio>
    <audio data-key="71" src="/assets/sounds/boom.wav"></audio>
    <audio data-key="72" src="/assets/sounds/ride.wav"></audio>
    <audio data-key="74" src="/assets/sounds/snare.wav"></audio>
    <audio data-key="75" src="/assets/sounds/tom.wav"></audio>
    <audio data-key="76" src="/assets/sounds/tink.wav"></audio>

    <script>
        // Variable & Functions
        const keyCodeValids = Array.from( document.querySelectorAll('.key') );
        const removeTransitionKey = ( e ) => {
            if(e.propertyName !== 'transform'){ return; }

            e.target.classList.remove('playing');
        };
        const playAudio = (key) => {
            const { keyCode } = key;
            const soundKeyElement =document.querySelector(`audio[data-key="${keyCode}"]`);
            const divKeyElement =document.querySelector(`div[data-key="${keyCode}"]`);
            if(!soundKeyElement){ return; }
            divKeyElement.classList.add('playing');
            soundKeyElement.currentTime= 0;
            soundKeyElement.play();
        };

        // Events
        keyCodeValids.forEach( key => { 
            key.addEventListener( 'transitionend', removeTransitionKey ) 
        });
        window.addEventListener('keydown', playAudio );
    </script>
</body>
</html>
